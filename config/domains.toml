# БАЗОВЫЕ домены фабрики Lab-100.
# Домены ПОДВИЖНЫ: их можно включать/выключать (enabled), менять приоритет
# (priority), добавлять свои — через профили (config/profiles/*.toml) и в рантайме.
# Файл читается при старте и перечитывается по reload() без перезапуска.

schema = "invr.factory.domains/1"

# Как домен выбирается под задачу:
#   domains.match_by = "explicit" | "keywords" | "capabilities" | "auto"
# AUTO: явный domain → keywords → capabilities.
match_by = "auto"

[domain.research]
title = "Исследование и сбор информации"
enabled = true
priority = 50
capabilities = ["web-search", "deep-research", "scrape", "answer"]
tools = ["browsertool", "doc-extract", "firecrawl-key"]
llm = ["firecrawl", "exa", "local-browser", "plain-http", "yandex-search", "ollama", "gemini"]
policy = "local-first, cloud-fallback"
region = "auto"                    # при блокировке — поднять region-spoof
keywords = ["найди", "исследуй", "обзор", "отчёт", "источник", "research", "search"]

[domain.coding]
title = "Разработка и код"
enabled = true
priority = 60
capabilities = ["code", "answer"]
tools = ["opencode-plugins", "mcp-watchdog"]
llm = ["ollama", "docker-agent", "cloud"]
policy = "local-first"
region = "auto"
keywords = ["код", "скрипт", "ошибка", "баг", "исправь", "напиши функцию", "code"]

[domain.docs]
title = "Документы и извлечение"
enabled = true
priority = 40
capabilities = ["scrape", "vision", "answer"]
tools = ["doc-extract"]
llm = ["ollama", "gemini"]
policy = "local-first"
region = "auto"
keywords = ["документ", "pdf", "таблица", "извлеки", "ocr", "распознай"]

[domain.infra]
title = "Инфраструктура и сервисы"
enabled = true
priority = 30
capabilities = ["answer", "code"]
tools = ["infra-graph", "mcp-watchdog", "opencode-status", "opencode-restart"]
llm = ["ollama", "docker-agent"]
policy = "local-only"
region = "none"
keywords = ["сервис", "порт", "docker", "mcp", "infra", "статус", "перезапусти"]

[domain.media]
title = "Медиа и визуализация"
enabled = false                    # выключен по умолчанию — включается в профиле
priority = 20
capabilities = ["vision", "answer"]
tools = ["doc-extract"]
llm = ["gemini", "ollama"]
policy = "cloud-fallback"
region = "auto"
keywords = ["картинка", "видео", "диаграмма", "визуал"]

[domain.spoof]
title = "Смена региона/доступ"
enabled = true
priority = 10
capabilities = ["region-switch"]
tools = ["ai-provider-check"]
llm = []
policy = "local-only"
region = "self"
keywords = ["регион", "прокси", "доступ", "заблокировано", "region", "vpn"]
