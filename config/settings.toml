# Схема настроек фабрики Lab-100
# ВНИМАНИЕ: изменения через `factory settings set` перезаписывают файл без комментариев.
schema = "invr.factory.settings/1"

# Активный профиль доменов (наложения поверх config/domains.toml)
active_profile = "default"

# Каталог результатов и единый журнал
catalog_dir = "catalog"
ledger_path = "state/ledger.jsonl"

# Файлы конфигурации (относительно корня репозитория)
domains_file = "config/domains.toml"
profiles_dir = "config/profiles"

# Проверять доступность исполнителей перед запуском
healthcheck = true

[ui]
# Интерфейс: cli | web | tray | all
mode = "all"
# Язык интерфейсов: ru | en | zh (по умолчанию ru)
lang = "ru"

[ui.web]
host = "127.0.0.1"
port = 8787

[ui.tray]
# Путь к иконке; пусто — иконка по умолчанию
icon = ""

[automation]
# Автоматизация: auto | semi
#   auto — полная автоматика
#   semi — полуавтомат, подтверждение на контрольных точках
mode = "auto"

[automation.semi]
# Шаги, требующие подтверждения в режиме semi.
# Пустой список — подтверждать каждый шаг.
checkpoints = ["scrape", "write", "cloud"]

[adapters]
# Управление внешними исполнителями (пути/включение)
lab100_enabled = true
lab100_dir = ""          # каталог репозитория Lab100; пусто — ищем рядом (Lab100/)
lab100_python = ""       # интерпретатор для Lab100; пусто — текущий python
lab100_cmd = ""          # переопределить команду, напр. "lab100" (если установлен)
invr_enabled = true
invr_root = ""           # корень INVR-Tools; пусто — env INVR_TOOLS_ROOT / ~/.devstation/tools
llm_local_enabled = true
ollama_host = "http://127.0.0.1:11434"
llm_local_model = ""     # модель Ollama по умолчанию; пусто — hermes3:3b
llm_local_auto_model = true  # если запрошенной модели нет — взять первую доступную
region_enabled = true
region_repo = ""         # каталог region-spoof; пусто — env REGION_SPOOF_DIR / рядом
deploy_dir = ""          # каталог devstation-deploy; пусто — env DEVSTATION_DEPLOY_DIR / рядом
backup_enabled = true    # учитывать изменения через backup-util (ChangeId) — этап 3
metrics_enabled = true   # отправлять метрики в orch-metrics — этап 3
infra_enabled = true     # карта сервисов/потока через infra-graph — §4.7

[inventory]
# Карта «что умеем» (этап 0); сохраняется командой `factory inventory`
path = "state/inventory.json"

[quotas]
# Зеркальный учёт расхода квот Lab100 (этап 4, `factory quotas`)
path = "state/quotas.json"

[metrics]
# Локальный приёмник метрик, если orch-metrics недоступен
path = "state/metrics.jsonl"

[infra]
# Локальный приёмник карты потока, если infra-graph недоступен
path = "state/infra.jsonl"

[watchdog]
# Супервизия (этап 5): период опроса и порог «зависшей» задачи, секунды
interval_s = 30
stuck_after_s = 600

[region]
# Регион по умолчанию для шага region-switch, если задача не задала свой
default = "US"

# --- Арсенал: пульт над всеми элементами (инструменты/службы/агенты/окружение) ---

[operation]
# Режим работы фабрики:
#   attached   — совместно с OpenCode: чужие узлы не трогаем, состояние делим с mcp-watchdog
#   standalone — автономно, без OpenCode: фабрика сама поднимает свои службы
mode = "attached"

[supervision]
# Авто-восстановление служб (owner = "factory"): auto | true | false
#   auto — включено только в режиме standalone
autostart = "auto"
interval_s = 30
# Ограничитель: не более N запусков в час (0 — без ограничения)
max_starts_per_hour = 6
# Не вмешиваться в узлы чужих владельцев (в т.ч. OpenCode)
coexistence = true

[logs]
# Сколько последних строк журналов показывать по умолчанию
limit_default = 200
# Путь к журналу OpenCode; пусто — <opencode.data_dir>/log/opencode.log
opencode_log = ""

[sources]
# Внешние источники состояния (для режима attached).
# Пути к mcp-watchdog можно не задавать: они выводятся из INVR_TOOLS_ROOT
# (<tools-root>\mcp-watchdog\state\current.json и <tools-root>\Logs\mcp-watchdog.log).
# Здесь — только если раскладка нестандартная (задать абсолютно).
mcp_watchdog_state = ""
mcp_watchdog_log = ""

[opencode]
# Окружение OpenCode (каталоги конфигурации и данных)
config_dir = ""           # пусто — ~/.config/opencode
data_dir = ""             # пусто — ~/.local/share/opencode
required = ["AGENTS.md", "opencode.json"]
optional = ["plugin", "plugins", "skills", "agent", "rotation"]

[arsenal]
# Снимок арсенала (состояния узлов) сохраняется супервизором
path = "state/arsenal.json"

# Службы. Значения по умолчанию заданы в factory/arsenal.py; здесь можно
# переопределить любую службу или добавить свою. Схема:
# [services.<name>]
# title   = "…"
# kind    = "http | tcp | command | process | file"
# url/host+port/command/match/path  — параметр проверки
# owner   = "factory | opencode | external"   # factory — фабрика может поднимать
# enabled = true
# start   = ["…"]     # команда запуска (для standalone/авто-восстановления)
# stop    = ["…"]     # команда остановки
# log     = "…"       # путь к журналу службы (для просмотра в фабрике)
# docker  = false     # true — исключить (проект без Docker)
#
# Исключено (проект без Docker): docker, gordon, model-runner — показаны
# как «unloaded», а не как сбой.

[providers]
# Переключатель внешних ИИ: встроенные бесплатные ассистенты сред разработки.
# Список и состояние: `factory providers list`; включить: `factory providers
# enable opencode`. Каждый провайдер хранится отдельной секцией:
#   [providers.opencode]
#   enabled = true          # включён переключателем
#   command = ""            # необязательно: переопределить команду запуска
# Доступные имена: opencode, claude-code, cursor, windsurf, void, zen, workai,
# multitool. Провайдеры не опрашиваются без нужды — только поимённое
# переключение владельцем.
auto_route = false          # true — направлять code/answer/deep-research во внешний агент

[routing]
# Направление компетенций на адаптер (перекрывает встроенную маршрутизацию).
# Формат: <адаптер> или <адаптер>:<действие>. Пример:
#   answer = "external_agent"
#   code   = "external_agent:chat"

[dispatch]
# Режим диспетчера: linear | dag
mode = "linear"
# Максимальное число параллельных шагов внутри уровня DAG
parallel = 2

[heal]
# Самопочинка рабочей копии (`factory heal`): прогон тестов и возврат к зелени.
# Включена ли починка при запуске из планировщика (--fix включает принудительно)
fix = false
# Лимит времени на прогон тестов, секунд
timeout = 900
# Каталог тестов для `python -m unittest discover`
tests = "tests"
# Явный интерпретатор Python (пусто — текущий либо py/python из PATH)
python = ""
# Чужая работа: сколько секунд правка считается «свежей» (её ещё пишут)
foreign_grace = 180
# Публикация (коммит/пуш): сколько секунд ждать завершения чужой работы (0 — не ждать)
wait = 0
# Пауза между проверками при ожидании завершения чужой работы, секунд
wait_interval = 30
